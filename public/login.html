<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · Receipt System</title>
<link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="ink-field drift" aria-hidden="true"><i class="ink-c"></i><i class="ink-m"></i><i class="ink-y"></i></div>
  <main class="login-page">
    <form class="card login-card" id="login-form">
      <div class="row" style="gap:12px; flex-wrap:nowrap;">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="9.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M18 2v32M2 18h32" stroke="currentColor" stroke-width="2.4"/><circle cx="18" cy="18" r="4.2" fill="#D6167A"/></svg></span>
        <div><h1>Receipt System</h1><p class="muted" style="margin:2px 0 0;">Sign in to ring up sales and run the printers</p></div>
      </div>
      <div class="cmyk-bar printing" aria-hidden="true"><span class="c"></span><span class="m"></span><span class="y"></span><span class="k"></span></div>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <div class="error-text" id="login-error" role="alert" hidden></div>
      <button class="btn btn-primary btn-lg btn-block" type="submit">Sign in</button>
      <p class="muted small" style="margin:0; text-align:center;">First run? The default admin is <strong>admin</strong> / <strong>admin123</strong>. Change it right after signing in.</p>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('login-error');
      const btn = e.target.querySelector('button[type=submit]');
      errorEl.hidden = true;
      btn.disabled = true;
      try {
        await api('POST', '/api/auth/login', {
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        });
        window.location.href = 'app.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.hidden = false;
        btn.disabled = false;
      }
    });

    // If already logged in, skip straight to the app.
    api('GET', '/api/auth/me').then((data) => {
      if (data.user) window.location.href = 'app.html';
    }).catch(() => { /* stay on the login form */ });
  </script>
</body>
</html>
