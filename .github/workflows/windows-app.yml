name: Windows app

on:
  push:
    paths:
      - 'server/**'
      - 'public/**'
      - 'agent/**'
      - 'scripts/**'
      - 'relay/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-app.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'

      - run: npm ci

      - name: Tests (agent + server)
        run: npm test

      - name: Build ReceiptSystem.exe and PrintMonitorAgent.exe
        run: npm run build:exe

      - name: Smoke test the apps
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Resolve-Path 'dist/ReceiptSystem-win-x64'
          $env:PORT = '3999'; $env:NO_BROWSER = '1'
          $server = Start-Process -FilePath "$dir/ReceiptSystem.exe" -WorkingDirectory $dir -PassThru `
            -RedirectStandardOutput server.log -RedirectStandardError server.err
          $base = 'http://localhost:3999'
          $up = $false
          for ($i = 0; $i -lt 40 -and -not $up; $i++) {
            Start-Sleep -Seconds 1
            try { $up = (Invoke-WebRequest "$base/login.html" -UseBasicParsing).StatusCode -eq 200 } catch {}
          }
          if (-not $up) { Get-Content server.log, server.err; throw 'ReceiptSystem.exe did not start' }

          $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $json = 'application/json'
          $login = Invoke-RestMethod -Method Post "$base/api/auth/login" -WebSession $s -ContentType $json `
            -Body '{"username":"admin","password":"admin123"}'
          if ($login.user.username -ne 'admin') { throw 'Login failed' }

          $sale = Invoke-RestMethod -Method Post "$base/api/sales" -WebSession $s -ContentType $json `
            -Body '{"items":[{"name":"Test print","qty":2,"unit_price":1.5}],"payment_method":"cash","amount_tendered":5}'
          if ($sale.total -ne 3 -or $sale.change_due -ne 2) { throw "Unexpected sale: $($sale | ConvertTo-Json)" }
          Invoke-RestMethod "$base/api/insights/forecast" -WebSession $s | Out-Null
          Invoke-RestMethod "$base/api/insights/toner" -WebSession $s | Out-Null
          if (-not (Test-Path "$dir/data/receipts.db")) { throw 'Database was not created beside the exe' }
          Write-Host "Server OK: sale $($sale.receipt_no)"

          # Agent: register, configure, run, and check it reports in.
          $agent = Invoke-RestMethod -Method Post "$base/api/agents" -WebSession $s -ContentType $json -Body '{"label":"CI runner"}'
          @{ backendUrl = $base; agentApiKey = $agent.api_key; heartbeatIntervalMs = 2000; readSupplies = $false; controlIdleIntervalMs = 2000 } |
            ConvertTo-Json | Set-Content -Encoding utf8 "$dir/config.json"
          $agentProc = Start-Process -FilePath "$dir/PrintMonitorAgent.exe" -WorkingDirectory $dir -PassThru `
            -RedirectStandardOutput agent.log -RedirectStandardError agent.err
          Start-Sleep -Seconds 10
          $agents = Invoke-RestMethod "$base/api/agents" -WebSession $s
          $ci = $agents.agents | Where-Object { $_.label -eq 'CI runner' }
          Get-Content agent.log -ErrorAction SilentlyContinue
          if ($ci.online -ne 1) { Get-Content agent.err -ErrorAction SilentlyContinue; throw 'PrintMonitorAgent.exe did not report in' }
          Write-Host 'Agent OK'

          # Remote printer control through the real PowerShell host: pause a
          # printer from the web API, see it reported paused, resume it.
          $printers = @()
          for ($i = 0; $i -lt 30 -and $printers.Count -eq 0; $i++) {
            Start-Sleep -Seconds 2
            $printers = @((Invoke-RestMethod "$base/api/printers" -WebSession $s).printers)
          }
          if ($printers.Count -eq 0) { Get-Content agent.log; throw 'No printers reported by the control host' }
          Write-Host "Printers: $(($printers | ForEach-Object { "$($_.name) [$($_.health)]" }) -join ', ')"
          $target = $printers | Where-Object { $_.name -like 'Microsoft Print to PDF*' } | Select-Object -First 1
          if (-not $target) { $target = $printers[0] }
          function Invoke-PrinterCommand($action) {
            $body = @{ agent_id = $target.agent_id; printer = $target.name; action = $action } | ConvertTo-Json
            $cmd = (Invoke-RestMethod -Method Post "$base/api/printers/commands" -WebSession $s -ContentType $json -Body $body).command
            for ($i = 0; $i -lt 30 -and $cmd.status -in @('queued', 'sent'); $i++) {
              Start-Sleep -Seconds 1
              $cmd = (Invoke-RestMethod "$base/api/printers/commands/$($cmd.id)" -WebSession $s).command
            }
            if ($cmd.status -ne 'done') { Get-Content agent.log; throw "$action on $($target.name): $($cmd.status) $($cmd.error)" }
          }
          Invoke-PrinterCommand 'pause_printer'
          $paused = $false
          for ($i = 0; $i -lt 15 -and -not $paused; $i++) {
            Start-Sleep -Seconds 1
            $p = (Invoke-RestMethod "$base/api/printers" -WebSession $s).printers | Where-Object { $_.name -eq $target.name }
            $paused = @($p.issues | Where-Object { $_.key -eq 'paused' }).Count -gt 0
          }
          if (-not $paused) { throw "Printer didn't show as paused: $($p | ConvertTo-Json -Depth 5)" }
          Invoke-PrinterCommand 'resume_printer'
          Write-Host "Printer control OK on $($target.name)"

          # A particular printer's features, read through the real PowerShell host.
          $q = "agent_id=$($target.agent_id)&printer=$([uri]::EscapeDataString($target.name))"
          $detail = $null
          for ($i = 0; $i -lt 30; $i++) {
            $detail = Invoke-RestMethod "$base/api/printers/detail?$q" -WebSession $s
            if ($detail.info_updated_at) { break }
            Start-Sleep -Seconds 1
          }
          if (-not $detail.info_updated_at) { Get-Content agent.log; throw 'Printer features were never read' }
          if (-not $detail.identity.driver.name) { throw "No driver name in printer features: $($detail | ConvertTo-Json -Depth 4)" }
          Write-Host "Features of $($target.name) via $($detail.identity.driver.name):"
          $detail.features | ForEach-Object { Write-Host "  $($_.label): $($_.status) $($_.value)" }
          if (@($detail.features | Where-Object { $_.key -eq 'paper_sizes' -and $_.status -eq 'yes' }).Count -eq 0) { throw 'Paper sizes were not read from the driver' }

          Stop-Process -Id $agentProc.Id -Force
          Stop-Process -Id $server.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ReceiptSystem-win-x64
          path: dist/ReceiptSystem-win-x64.zip
          retention-days: 30
