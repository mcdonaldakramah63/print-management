<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receipt — Vicamp Print OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/print.css">
</head>
<body>
  <div class="toolbar">
    <div class="title" id="toolbar-title">Receipt</div>
    <div class="actions">
      <button onclick="window.close();">&larr; Close</button>
      <button id="download-btn">Download PDF</button>
      <button class="primary" id="print-btn">&#128438; Print</button>
    </div>
  </div>

  <div class="page-wrap">
    <div class="receipt-page" id="receipt-root">
      <div style="text-align:center;padding:60px 0;color:#888;font-family:sans-serif;">Loading receipt&hellip;</div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/receipt.js"></script>
</body>
</html>
